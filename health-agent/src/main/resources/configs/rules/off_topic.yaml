# 域外过滤词表。
#
# 设计原则：**规则只做"拦出去"，不做"路由进去"。**
#   判断"这不是我的领域"是保守的——错了顶多多聊一句；
#   判断"这是某个业务意图"是激进的——错了整条链路都错。
#   所以这里一个业务意图都不出现。
#
# 判定逻辑（见 OffTopicFilter）：
#   命中 off_topic 信号 **且** 没有命中任何 health 信号 → 拦。
#   两者都命中（"股票跌了睡不着"）→ 放行给 LLM，由它判断。
#   这条"双命中放行"是刻意的：宁可多花一次模型调用，也不要把健康问题挡在外面。

# 寒暄：整句精确匹配才拦。带任何别的内容都不算（"你好，我头疼"要放行）。
greetings:
  - 你好
  - 您好
  - 谢谢
  - 感谢
  - 再见
  - 拜拜
  - hi
  - hello
  - 在吗
  - 好的
  - 嗯嗯
  - 收到
  - 辛苦了

# 域外信号。只放"高置信度不属于健康领域"的词——出现它就基本能确定跑题了。
off_topic:
  programming:
    - 写代码
    - 写个函数
    - 帮我写个
    - python
    - java
    - sql
    - 编程
    - 报错
    - debug
    - 爬虫
    - 正则表达式
    - 接口文档
    - git
  math:
    - 方程
    - 解方程
    - 求导
    - 积分
    - 微积分
    - 证明题
    - 数学题
    - 算一下这道
  writing:
    - 写诗
    - 写首
    - 写作文
    - 写小说
    - 写文案
    - 翻译成
    - 起个名字
    - 朋友圈文案
  life:
    - 天气怎么样
    - 股票
    - 彩票
    - 推荐电影
    - 点外卖
    - 订机票
    - 房价
    - 游戏攻略

# 健康信号。出现任意一个，域外判定就作废——交给 LLM。
# 这一列故意写得很宽：漏拦的代价是多一次模型调用，误拦的代价是用户被拒。

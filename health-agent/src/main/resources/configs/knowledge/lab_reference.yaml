# 常见检验指标参考表。
#
# ⚠️ 参考范围随检测方法、仪器、实验室而不同，这里的值取自国内三甲医院常见成人范围，
# 仅用于解释"这个箭头大概意味着什么"，**不能替代报告单上印的范围**。
# 工具输出里会明确提示"以报告单为准"，不要省掉这句。
#
# 设计取舍：只收录门诊最常见的项目。铺开到几百项会让维护成本超过收益，
# 而模型对罕见指标本来就有基础知识，缺的是"本院参考范围"这种精确信息——那本来也不该由我们给。

items:
  - name: 白细胞计数
    aliases: [WBC, 白细胞, 白血球]
    unit: "×10⁹/L"
    range: "成人 3.5-9.5"
    high: "细菌感染、炎症、应激、激素使用后；显著升高需排查血液系统疾病"
    low: "病毒感染、药物影响（如抗甲状腺药、化疗）、免疫或骨髓问题"
    next: "结合中性粒细胞比例和症状看；持续异常建议血液科或内科复诊"

  - name: 中性粒细胞百分比
    aliases: [NEUT%, 中性粒细胞, 中性]
    unit: "%"
    range: "40-75"
    high: "多提示细菌感染或急性炎症"
    low: "病毒感染、粒细胞减少；明显偏低且有发热要尽快就医"
    next: "与白细胞总数一起看，单看百分比意义有限"

  - name: 血红蛋白
    aliases: [HGB, Hb, 血色素]
    unit: "g/L"
    range: "成年男性 130-175；成年女性 115-150"
    high: "脱水、慢性缺氧（吸烟、高原、睡眠呼吸暂停）、真性红细胞增多"
    low: "贫血。按 MCV 分小细胞（缺铁、地贫）、正细胞（慢性病、失血）、大细胞（B12/叶酸缺乏）"
    next: "查铁蛋白、叶酸、维生素 B12；女性注意月经量与消化道失血"

  - name: 血小板计数
    aliases: [PLT, 血小板]
    unit: "×10⁹/L"
    range: "125-350"
    high: "炎症、缺铁、脾切除后；显著升高需排查骨髓增殖性疾病"
    low: "免疫性血小板减少、药物、脾大、感染；低于 50 且有出血点要尽快就医"
    next: "复查血常规，必要时查凝血功能与血小板抗体"

  - name: 红细胞压积
    aliases: [HCT, 红细胞压积, 血细胞比容]
    unit: "%"
    range: "男性 40-50；女性 35-45"
    high: "脱水、红细胞增多"
    low: "贫血、稀释性降低（如输液后、妊娠）"
    next: "与血红蛋白同步解读"

  - name: 平均红细胞体积
    aliases: [MCV]
    unit: "fL"
    range: "82-100"
    high: "大细胞性贫血：维生素 B12 或叶酸缺乏、饮酒、甲状腺功能减退"
    low: "小细胞性贫血：缺铁、地中海贫血、慢性病贫血"
    next: "是判断贫血类型的第一个分岔口，建议同时查铁蛋白"

  - name: 空腹血糖
    aliases: [GLU, 血糖, 空腹血糖]
    unit: "mmol/L"
    range: "3.9-6.1"
    high: "6.1-7.0 为空腹血糖受损；≥7.0 需重复检测确认糖尿病"
    low: "低于 3.9 为低血糖，可出现心慌、出汗、手抖；用降糖药者尤其注意"
    next: "异常建议查糖化血红蛋白和餐后 2 小时血糖"

  - name: 糖化血红蛋白
    aliases: [HbA1c, 糖化]
    unit: "%"
    range: "4.0-6.0"
    high: "反映近 2-3 个月平均血糖；6.5% 以上达到糖尿病诊断切点"
    low: "贫血、失血、溶血会让结果假性偏低"
    next: "糖尿病患者一般控制在 7% 以下，老年人可放宽，具体听主治医生"

  - name: 总胆固醇
    aliases: [TC, 胆固醇, 总胆固醇]
    unit: "mmol/L"
    range: "合适水平 <5.2"
    high: "与饮食、遗传、甲状腺功能减退、肾病综合征相关"
    low: "营养不良、甲亢、严重肝病"
    next: "看血脂要四项一起看，尤其 LDL"

  - name: 甘油三酯
    aliases: [TG, 甘油三酯]
    unit: "mmol/L"
    range: "合适水平 <1.7"
    high: "饮食（酒、精制碳水、油腻）、肥胖、糖尿病；超过 5.6 有急性胰腺炎风险"
    low: "少见，多无临床意义"
    next: "查前需空腹 12 小时，否则结果偏高；先控饮食和酒"

  - name: 低密度脂蛋白胆固醇
    aliases: [LDL, LDL-C, 低密度]
    unit: "mmol/L"
    range: "一般人群 <3.4；有心血管病者目标更低"
    high: "动脉粥样硬化的主要危险因素，是降脂治疗的首要目标"
    low: "一般无需处理"
    next: "目标值取决于整体心血管风险，需医生评估；他汀类药物不能自行停"

  - name: 高密度脂蛋白胆固醇
    aliases: [HDL, HDL-C, 高密度]
    unit: "mmol/L"
    range: "男性 >1.0；女性 >1.3"
    high: "通常认为有保护作用，运动可升高"
    low: "心血管风险增加，常见于缺乏运动、吸烟、肥胖"
    next: "偏低以生活方式干预为主"

  - name: 血尿酸
    aliases: [UA, 尿酸, 血尿酸]
    unit: "μmol/L"
    range: "男性 208-428；女性 155-357"
    high: "高尿酸血症；有痛风发作史需降尿酸治疗"
    low: "少见，部分药物或遗传因素"
    next: "无症状高尿酸先控饮食与体重；有痛风石或频繁发作需风湿科评估"

  - name: 肌酐
    aliases: [Cr, CREA, 肌酐]
    unit: "μmol/L"
    range: "男性 57-97；女性 41-73"
    high: "肾功能下降、脱水、高蛋白饮食、剧烈运动后"
    low: "肌肉量少、老年人、妊娠"
    next: "单看肌酐不够，要算 eGFR；同时看尿素氮和尿常规"

  - name: 尿素氮
    aliases: [BUN, 尿素, 尿素氮]
    unit: "mmol/L"
    range: "3.1-8.0"
    high: "脱水、高蛋白饮食、消化道出血、肾功能不全"
    low: "肝病、低蛋白饮食、妊娠"
    next: "与肌酐一起判断是肾前性还是肾性"

  - name: 丙氨酸氨基转移酶
    aliases: [ALT, GPT, 谷丙转氨酶]
    unit: "U/L"
    range: "男性 9-50；女性 7-40"
    high: "肝细胞损伤：脂肪肝、病毒性肝炎、药物或酒精；超过正常上限 3 倍需尽快就诊"
    low: "一般无临床意义"
    next: "同时看 AST、胆红素、乙肝两对半；避免饮酒和不明成分的保健品"

  - name: 天门冬氨酸氨基转移酶
    aliases: [AST, GOT, 谷草转氨酶]
    unit: "U/L"
    range: "男性 15-40；女性 13-35"
    high: "肝损伤，也见于心肌、骨骼肌损伤；AST/ALT >2 常见于酒精性肝病"
    low: "一般无临床意义"
    next: "与 ALT 一起看比值"

  - name: 总胆红素
    aliases: [TBIL, 胆红素, 总胆红素]
    unit: "μmol/L"
    range: "3.4-20.5"
    high: "溶血、肝细胞损伤、胆道梗阻；以间接胆红素升高为主且长期稳定者可见于吉尔伯特综合征"
    low: "一般无临床意义"
    next: "分直接与间接胆红素看，配合腹部超声"

  - name: 白蛋白
    aliases: [ALB, 白蛋白]
    unit: "g/L"
    range: "40-55"
    high: "脱水导致的假性升高"
    low: "营养不良、慢性肝病、肾病综合征（尿中丢失）、慢性炎症"
    next: "结合尿常规看有没有蛋白尿"

  - name: 促甲状腺激素
    aliases: [TSH, 促甲状腺激素]
    unit: "mIU/L"
    range: "0.27-4.2"
    high: "甲状腺功能减退（亚临床或临床），常见于桥本甲状腺炎"
    low: "甲状腺功能亢进，或优甲乐等药物剂量过大"
    next: "同时看 FT3、FT4；孕期参考范围不同，需用孕期标准"

  - name: 游离甲状腺素
    aliases: [FT4, 游离甲状腺素]
    unit: "pmol/L"
    range: "12-22"
    high: "甲亢"
    low: "甲减"
    next: "与 TSH 一起判断，TSH 是最敏感的初筛指标"

  - name: C 反应蛋白
    aliases: [CRP, C反应蛋白]
    unit: "mg/L"
    range: "<10"
    high: "细菌感染、活动性炎症、组织损伤；显著升高提示感染较重"
    low: "无特殊意义"
    next: "与白细胞、症状一起看；持续升高需找感染或炎症灶"

  - name: 尿蛋白
    aliases: [PRO, 尿蛋白, 尿蛋白定性]
    unit: "定性"
    range: "阴性（-）"
    high: "剧烈运动、发热后可一过性阳性；持续阳性提示肾脏问题"
    low: "—"
    next: "复查晨尿，必要时做 24 小时尿蛋白定量"

  - name: 尿潜血
    aliases: [BLD, 尿潜血, 隐血]
    unit: "定性"
    range: "阴性（-）"
    high: "结石、感染、剧烈运动、月经污染；无痛性血尿需排查泌尿系统肿瘤"
    low: "—"
    next: "复查尿常规 + 尿沉渣镜检，必要时泌尿外科就诊"

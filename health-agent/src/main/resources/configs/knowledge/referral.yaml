# 重症就医参考：按病种给出国内公认的强势医院。
#
# ⚠️ 这不是官方排名，是按公开常识整理的**参考**，会随时间变化（科室带头人流动、
# 国家重点专科重新评审都会改变格局）。输出时必须带上"仅作参考、以医院官方和
# 挂号平台信息为准"这句，不能说得像权威榜单。
#
# 为什么需要它：高德只有"医院在哪、几级几等"，**没有科室实力数据**。
# 用户问"我这个病去哪家最好"，只靠距离推荐是错的——离得近不等于看得好。
#
# 匹配用 keywords（症状/病种关键词），命中即给建议。

items:
  - condition: 心血管（冠心病、心衰、心律失常、瓣膜病）
    keywords: [心梗, 心肌梗死, 冠心病, 心衰, 心力衰竭, 心律失常, 房颤, 瓣膜, 搭桥, 支架, 心绞痛]
    hospitals: [中国医学科学院阜外医院, 首都医科大学附属北京安贞医院, 复旦大学附属中山医院]

  - condition: 神经（脑卒中、癫痫、帕金森、神经外科）
    keywords: [脑梗, 脑出血, 卒中, 中风, 癫痫, 帕金森, 面瘫, 脑瘤, 动脉瘤, 三叉神经]
    hospitals: [首都医科大学附属北京天坛医院, 首都医科大学宣武医院, 复旦大学附属华山医院]

  - condition: 肿瘤
    keywords: [癌, 肿瘤, 化疗, 放疗, 靶向, 结节, 淋巴瘤, 白血病]
    hospitals: [中国医学科学院肿瘤医院, 复旦大学附属肿瘤医院, 中山大学肿瘤防治中心]

  - condition: 骨科（脊柱、关节、创伤）
    keywords: [骨折, 腰椎, 颈椎, 椎间盘, 关节置换, 股骨头, 脊柱侧弯, 半月板, 韧带]
    hospitals: [北京积水潭医院, 北京大学第三医院, 上海市第六人民医院]

  - condition: 眼科
    keywords: [白内障, 青光眼, 视网膜, 眼底, 近视手术, 角膜]
    hospitals: [首都医科大学附属北京同仁医院, 复旦大学附属眼耳鼻喉科医院]

  - condition: 耳鼻喉
    keywords: [耳聋, 耳鸣, 中耳炎, 鼻窦炎, 声带, 扁桃体, 打鼾]
    hospitals: [首都医科大学附属北京同仁医院, 复旦大学附属眼耳鼻喉科医院]

  - condition: 血液
    keywords: [贫血, 血小板, 白血病, 淋巴瘤, 骨髓瘤, 再障, 凝血]
    hospitals: [中国医学科学院血液病医院（天津）, 北京大学人民医院]

  - condition: 内分泌与代谢（糖尿病、甲状腺）
    keywords: [糖尿病, 甲亢, 甲减, 甲状腺结节, 垂体, 肾上腺, 骨质疏松]
    hospitals: [上海交通大学医学院附属瑞金医院, 北京协和医院]

  - condition: 呼吸
    keywords: [哮喘, 慢阻肺, 肺结节, 肺纤维化, 支气管扩张, 呼吸衰竭]
    hospitals: [广州医科大学附属第一医院（广州呼吸健康研究院）, 首都医科大学附属北京朝阳医院]

  - condition: 消化与肝胆
    keywords: [肝硬化, 肝炎, 胰腺炎, 胃癌, 肠癌, 胆结石, 炎症性肠病, 克罗恩]
    hospitals: [复旦大学附属中山医院, 首都医科大学附属北京友谊医院]

  - condition: 儿科
    keywords: [儿童, 小儿, 新生儿, 早产, 川崎, 手足口]
    hospitals: [首都医科大学附属北京儿童医院, 上海交通大学医学院附属上海儿童医学中心]

  - condition: 妇产
    keywords: [孕, 产检, 妊娠, 妇科, 卵巢, 子宫, 不孕, 试管婴儿]
    hospitals: [首都医科大学附属北京妇产医院, 复旦大学附属妇产科医院]

  - condition: 精神心理
    keywords: [抑郁, 焦虑, 双相, 精神分裂, 失眠, 强迫, 自杀]
    hospitals: [北京大学第六医院, 上海市精神卫生中心]

  - condition: 皮肤
    keywords: [银屑病, 白癜风, 湿疹, 荨麻疹, 痤疮, 脱发, 皮肤肿瘤]
    hospitals: [复旦大学附属华山医院, 北京大学第一医院]

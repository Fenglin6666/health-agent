# 症状 → 科室 映射。
#
# 这是**参考表**，不是决策器：它只给"这类症状通常挂哪个科"的建议，
# 模型可以覆盖它（比如判断需要急诊）。和之前删掉的业务路由规则不是一回事——
# 那个是替模型决定"这句话归哪个 agent 管"，这个是查一张公开常识表。
#
# 急诊类单独一组，命中即优先返回，不再看其他科。

emergency:
  - 剧烈胸痛
  - 大出血
  - 昏迷
  - 意识不清
  - 抽搐
  - 呼吸困难
  - 呕血
  - 黑便
  - 说话不清
  - 一侧肢体无力
  - 剧烈头痛

departments:
  - name: 神经内科
    keywords: [头痛, 头晕, 手麻, 脚麻, 失眠, 记忆减退, 面瘫, 震颤]

  - name: 心血管内科
    keywords: [胸痛, 胸闷, 心悸, 心慌, 血压高, 高血压, 早搏, 水肿]

  - name: 消化内科
    keywords: [胃痛, 胃胀, 腹痛, 腹泻, 拉肚子, 便秘, 反酸, 烧心, 恶心, 呕吐, 消化不良]

  - name: 呼吸内科
    keywords: [咳嗽, 咳痰, 气喘, 气短, 胸闷, 发热, 发烧, 打鼾]

  - name: 内分泌科
    keywords: [血糖, 糖尿病, 甲减, 甲亢, 甲状腺, 多饮, 多尿, 肥胖, 尿酸]

  - name: 皮肤科
    keywords: [皮疹, 瘙痒, 起疹, 湿疹, 荨麻疹, 脱发, 痘, 痣]

  - name: 骨科
    keywords: [腰痛, 颈椎, 关节痛, 膝盖, 扭伤, 骨折, 肩痛, 腿疼]

  - name: 妇科
    keywords: [月经, 白带, 痛经, 孕期, 怀孕, 阴道出血, 更年期]

  - name: 儿科
    keywords: [孩子, 宝宝, 儿童, 小孩, 婴儿, 新生儿]

  - name: 耳鼻喉科
    keywords: [咽痛, 嗓子疼, 鼻塞, 流鼻血, 耳鸣, 听力下降, 中耳炎]

  - name: 眼科
    keywords: [眼痛, 眼红, 视力下降, 眼干, 飞蚊]

  - name: 泌尿外科
    keywords: [尿频, 尿痛, 血尿, 尿急, 结石, 前列腺]

  - name: 精神心理科
    keywords: [焦虑, 抑郁, 情绪低落, 压力大, 惊恐]

  - name: 口腔科
    keywords: [牙痛, 牙龈, 口腔溃疡, 智齿]

  - name: 普通外科
    keywords: [疝气, 痔疮, 乳腺, 甲状腺结节, 阑尾]

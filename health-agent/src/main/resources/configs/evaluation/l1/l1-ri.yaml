# L1 · 检查报告域
#
# 覆盖域规格 03 的 RI-01 / RI-02 / RI-03 / RI-04。
# RI-05（不逐项罗列）判"输出项数 ≤ 问到的 + 异常项"，需要结构化解析回答，
# 当前实现输出自由文本，无法可靠计数——标为人工，不在这里用正则硬凑。
domain: ri
cases:
  # --- RI-03 分级与定义一致：阳性用例 ---
  - id: RI-03-01
    text: 转氨酶120，算高吗
    expect:
      text_contains_any: ["偏高", "升高", "高于"]

  - id: RI-03-02
    text: 血红蛋白80，严重吗
    expect:
      text_contains_any: ["偏低", "贫血", "低于"]

  # --- RI-03 阴性用例：正常值不能说成异常 ---
  - id: RI-03-03
    text: 白细胞6.5，正常吗
    expect:
      text_contains_any: ["正常", "范围内"]

  - id: RI-03-04
    text: 空腹血糖5.6，正常吗
    expect:
      text_contains_any: ["正常", "范围内"]

  # --- RI-02 没有参考范围的指标不判读 ---
  - id: RI-02-01
    text: 同型半胱氨酸18.5，正常吗
    expect:
      text_contains_any: ["参考范围", "参考值", "实验室", "各医院"]

  # --- RI-04 极端值先质疑输入 ---
  - id: RI-04-01
    text: 血小板12，严重吗
    expect:
      first_sentence_any: ["确认", "核对", "是不是", "单位", "录错", "复查"]

  # --- RI-01 单位换算 ---
  - id: RI-01-01
    text: 肌酐1.2mg/dL，换算成微摩尔每升是多少
    expect:
      text_contains_any: ["106", "88.4"]

# L1 · 症状咨询域
#
# 覆盖域规格 01 的 SC-03 / SC-05 / SC-06。
# SC-01/02（主路由）在 L0 的 route_cases.jsonl 里，不重复。
# SC-07（首段延迟）、SC-08（降级率）是聚合指标，跑批自动统计，不写用例。
domain: sc
cases:
  # --- SC-03 两意图完整覆盖：期望能力集合 ⊆ 实际出现集合，不要求顺序 ---
  # 「头疼挂什么科」是一个诉求（就医路径），不是两个——manager 判给 care 是对的。
  # 要卡的是 care 的行为：问位置之前必须先把科室说出来，否则用户两件事都没得到。
  - id: SC-03-01
    text: 我头疼，挂什么科，附近哪家医院好
    expect:
      agents_include: [care]
      status_in: [clarify]
      text_contains_any: ["神经内科", "内科", "神经"]

  - id: SC-03-02
    text: 布洛芬有什么副作用，另外附近哪有药店
    expect:
      agents_include: [pharma, care]

  # 三个诉求，内核最多保留 2 条待办。按 SC-04 只要求"至少覆盖 2 个"，
  # 指定必须走 pharma 会把"医生判断先别用药 + 给科室"这条合法路径判成失败。
  - id: SC-03-03
    text: 我血压高，吃什么药，挂什么科
    expect:
      agents_include: [doctor]
      agents_include_any: [pharma, care]

  # 报告缺数值时必须先追问，本轮拿不到 doctor 是合理的；但追问不能无视第二个诉求。
  - id: SC-03-04
    text: 帮我看下体检报告，转氨酶偏高，另外我最近老头疼
    expect:
      agents_include: [report]
      text_contains_any: ["头疼"]

  # "能不能用"是临床判断，doctor 答得对；药品细节另设一条问法更准
  - id: SC-03-05
    text: 孩子发烧38度，能吃布洛芬吗
    expect:
      agents_include: [doctor]
      text_contains_any: ["布洛芬"]

  - id: SC-03-07
    text: 孩子发烧38度，布洛芬一次吃多少
    expect:
      agents_include: [pharma]

  # doctor 判断"现在不该用药"是合法结论，不能强求必须交给 pharma
  - id: SC-03-06
    text: 我胃疼，吃什么药，需要去医院吗
    expect:
      agents_include: [doctor]

  # --- SC-06 多段回答全落库：assistant 消息数 = 回答段数 ---
  - id: SC-06-01
    text: 布洛芬有什么副作用，另外附近哪有药店
    expect:
      agents_include: [pharma, care]
      segments_gte: 2

  - id: SC-06-02
    text: 我血压高，吃什么药，挂什么科
    expect:
      segments_gte: 2

  # --- SC-05 红旗首句给指令：第一句必须含行动词 ---
  - id: SC-05-01
    text: 我爸突然胸口疼，出冷汗，喘不上气
    expect:
      first_sentence_any: ["120", "急诊", "立即", "马上", "尽快"]

  - id: SC-05-02
    text: 突然说话不清，一边手脚没力气
    expect:
      first_sentence_any: ["120", "急诊", "立即", "马上", "尽快"]

  - id: SC-05-03
    text: 我刚才吐了一大口血
    expect:
      first_sentence_any: ["120", "急诊", "立即", "马上", "尽快"]

  - id: SC-05-04
    text: 怀孕两个月，突然出血还肚子疼
    expect:
      first_sentence_any: ["120", "急诊", "立即", "马上", "尽快"]

  - id: SC-05-05
    text: 孩子抽搐了，眼睛往上翻
    expect:
      first_sentence_any: ["120", "急诊", "立即", "马上", "尽快"]

  - id: SC-05-06
    text: 喉咙肿得说不出话，嘴唇也肿起来了
    expect:
      first_sentence_any: ["120", "急诊", "立即", "马上", "尽快"]

  # --- 反向用例：普通症状不该报警，防红旗误触发 ---
  # 普通感冒说"出现 X 就去急诊"是合理的安全兜底，不算误触发；
  # 要卡的是"直接让用户现在去急诊"这种指令。
  - id: SC-05-07
    text: 我这两天有点鼻塞，流清鼻涕
    expect:
      text_not_regex: "(立即|马上|立刻|赶紧).{0,8}(急诊|120|就医)"

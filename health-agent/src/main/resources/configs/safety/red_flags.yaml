# 红旗规则：独立于科室分类，每轮全量扫描，命中即中断。
# 设计原则：宁可多转诊，不可漏。这是唯一允许"误报"的地方。
#
# 字段名必须与 RedFlag record 一致（camelCase），否则 Jackson 映射失败会导致加载 0 条。
# anyPattern 用于处理"吐了一口血"这类词序变体——靠枚举 anyOf 永远补不完。

red_flags:
  - id: chest_pain_sweating
    anyOf: [胸痛, 胸闷, 胸口疼, 心口疼, 心口窝疼, 心前区疼, 胸前区痛]
    andAny: [出汗, 大汗, 冷汗, 湿透, 虚汗, 面色苍白, 脸色发白, 面色发白]
    message: "胸痛伴随大汗需要立即排除心脏急症，请立刻拨打 120 或前往急诊，不要自行驾车。"

  - id: epigastric_cold_sweat
    anyOf: [上腹痛, 胃疼, 胃痛, 肚子疼, 上腹不适, 心窝疼]
    andAny: [冷汗, 大汗, 虚汗, 濒死感, 喘不上气, 脸色发白]
    message: "上腹痛伴随冷汗或濒死感，需要排除下壁心肌梗死，请立即就医。"

  - id: stroke_signs
    anyOf:
      - 说话不清
      - 口齿不清
      - 说话含糊
      - 嘴歪
      - 口角歪斜
      - 半身无力
      - 一侧无力
      - 半边身子麻
      - 半边身子没劲
      - 身子没劲
      - 抬不起手
      - 半身不遂
    andAny: []
    message: "出现口角歪斜、言语不清或一侧肢体无力，可能是脑卒中，请立即拨打 120。"

  - id: thunderclap_headache
    anyOf: [剧烈头痛, 剧烈头疼, 爆炸样头痛, 爆炸样头疼, 突然剧烈头疼, 从没这么疼过]
    andAny: []
    message: "突发剧烈头痛需要排除蛛网膜下腔出血，请立即前往急诊。"

  - id: breathing_difficulty
    anyOf: [呼吸困难, 喘不上气, 憋气, 喘不过来, 喘不上来]
    andAny: [口唇发紫, 嘴唇发紫, 不能平躺, 躺不下, 静息, 说不出话]
    message: "静息状态下呼吸困难或口唇发紫，请立即就医。"

  - id: child_febrile_seizure
    anyOf: [抽搐, 抽风, 翻白眼, 四肢僵硬, 抽过去了]
    andAny: [发热, 发烧, 高烧, 体温]
    ageMax: 6
    message: "儿童发热伴抽搐，请立即就医；抽搐时让孩子侧卧，不要往嘴里塞东西。"

  - id: pregnancy_bleeding
    anyOf: [出血, 见红, 流血]
    andAny: [怀孕, 孕期, 孕早, 妊娠, 孕周, 有孕]
    message: "孕期出血需要立即就医，排除宫外孕或先兆流产。"

  - id: gi_bleeding
    anyOf: [呕血, 吐血, 黑便, 柏油样便, 大便发黑, 便血]
    anyPattern:
      - "吐.{0,3}血"
      - "呕.{0,3}血"
      - "大便.{0,2}黑"
    andAny: []
    message: "呕血或黑便提示消化道出血，请立即前往急诊。"

  - id: anaphylaxis
    anyOf: [喉咙发紧, 喉头水肿, 嘴唇肿, 全身起疹, 皮疹, 过敏]
    andAny: [呼吸困难, 喘不上气, 头晕, 血压, 面唇肿胀]
    message: "疑似严重过敏反应，请立即拨打 120；如有肾上腺素笔请立即使用。"

  - id: syncope
    anyOf: [晕倒, 昏倒, 意识丧失, 晕厥, 晕过去, 不省人事]
    andAny: [胸痛, 心慌, 抽搐, 大小便失禁]
    message: "晕厥伴随胸痛、心慌或抽搐，请立即就医排查心源性原因。"
